name: Release

# Al subir una etiqueta (por ejemplo v0.2.0) se compila SIN la llave de sala y se publica en GitHub:
# instalador y portable de Windows, AppImage y .pacman de Linux, más los archivos que usa el actualizador.
# Quien descargue estos archivos introduce el código de sala la primera vez.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: (sudo apt-get update || true) && sudo apt-get install -y libarchive-tools
      - name: Compilar y publicar (Windows)
        if: runner.os == 'Windows'
        env:
          HUMBLECHAT_PUBLIC: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.js --win nsis portable zip --x64 --publish always
      - name: Compilar y publicar (Linux)
        if: runner.os == 'Linux'
        env:
          HUMBLECHAT_PUBLIC: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.js --linux AppImage pacman --x64 --publish always

  # Solo se conservan las 2 publicaciones más recientes: las demás (y sus etiquetas) se borran al terminar de publicar.
  podar:
    name: Dejar solo las 2 últimas publicaciones
    needs: publicar
    if: ${{ needs.publicar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Borrar publicaciones antiguas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --exclude-drafts --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Borrando $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
