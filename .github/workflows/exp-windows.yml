name: Experimento túnel (temporal)
on:
  push:
    paths: ['test/exp/**', '.github/workflows/exp-windows.yml']
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Bucle local
        shell: bash
        env: { VARIANT: loop }
        run: node_modules/.bin/electron --no-sandbox test/exp 2>&1 | grep -E "RESULT|TIMEOUT|direcciones|addIce" || true
      - name: IP de la propia máquina
        shell: bash
        env: { VARIANT: lan }
        run: node_modules/.bin/electron --no-sandbox test/exp 2>&1 | grep -E "RESULT|TIMEOUT|direcciones|addIce" || true
