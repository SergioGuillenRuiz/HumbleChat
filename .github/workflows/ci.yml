name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Núcleo P2P
        run: npm test
      - name: Instalar Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Prueba de humo (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:smoke
      - name: Prueba de humo (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke
      - name: Interfaz completa, 3 instancias (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - name: Contenido, audio y voz con relé (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e2
      - name: Contenido de la interfaz (Windows)
        if: runner.os == 'Windows'
        run: node test/e2e2.js contenido

  paquete:
    name: Paquete y ejecución (${{ matrix.os }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar llave de prueba (solo para esta ejecución)
        run: node scripts/ensure-key.js
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.js --win nsis portable zip --x64 --publish never
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libarchive-tools
          npx electron-builder --config electron-builder.config.js --linux AppImage pacman --x64 --publish never
      - name: Ejecutar la app empaquetada (Windows)
        if: runner.os == 'Windows'
        env:
          HC_EXE: ${{ github.workspace }}\dist\win-unpacked\humblechat.exe
        run: npm run test:smoke
      - name: Ejecutar la app empaquetada (Linux)
        if: runner.os == 'Linux'
        env:
          HC_EXE: ${{ github.workspace }}/dist/linux-unpacked/humblechat
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:smoke
      - name: Listar resultados
        shell: bash
        run: ls -la dist | grep -E "exe|zip|AppImage|pacman" || true
