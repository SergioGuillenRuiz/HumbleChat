name: Nueva versión

# Sube la versión, crea la etiqueta y lanza la publicación. Sin pasos manuales:
# se ejecuta desde Actions (o Claude lo dispara con workflow_dispatch). Solo desde main.
# Con dry_run=true hace todo salvo subir, etiquetar y publicar (sirve para probar el flujo y puede ejecutarse desde cualquier rama).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch | minor | major'
        required: true
        default: patch
      dry_run:
        description: 'Ensayo: no sube, no etiqueta, no publica'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verificar antes de publicar
        run: (sudo apt-get update || true) && sudo apt-get install -y xvfb && npm run verify:quick
      - name: Calcular la versión nueva
        id: v
        run: |
          case "${{ inputs.bump }}" in patch|minor|major) ;; *) echo "bump debe ser patch, minor o major"; exit 1;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "Versión %s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Resultado del ensayo
        if: inputs.dry_run
        run: |
          echo "ENSAYO: se publicaría ${{ steps.v.outputs.tag }}. No se ha subido, etiquetado ni publicado nada."
          git log --oneline -1
          git tag --points-at HEAD
      - name: Subir versión y etiqueta
        if: '!inputs.dry_run'
        run: git push origin main --follow-tags
      - name: Lanzar publicación (un push con GITHUB_TOKEN no dispara otros flujos)
        if: '!inputs.dry_run'
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh workflow run release.yml --ref "${{ steps.v.outputs.tag }}"
