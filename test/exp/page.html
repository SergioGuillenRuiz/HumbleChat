<script>
const { ipcRenderer } = require('electron')
const strip = (s) => s.split('\r\n').filter((l) => !l.startsWith('a=candidate') && !l.startsWith('a=end-of-candidates')).join('\r\n')
;(async () => {
  const { qa, qb, addr, lan } = await ipcRenderer.invoke('ports')
  console.log('direcciones LAN: ' + lan.join(',') + ' · proxy en ' + addr)
  const pc1 = new RTCPeerConnection({ bundlePolicy: 'max-bundle' }), pc2 = new RTCPeerConnection({ bundlePolicy: 'max-bundle' })
  const ms = await navigator.mediaDevices.getUserMedia({ audio: true, video: true })
  ms.getTracks().forEach((t) => pc1.addTrack(t, ms))
  pc2.addTransceiver('audio', { direction: 'recvonly' })
  const o = await pc1.createOffer(); await pc1.setLocalDescription(o)
  await new Promise((r) => setTimeout(r, 1500))
  await pc2.setRemoteDescription({ type: 'offer', sdp: strip(pc1.localDescription.sdp) })
  const a = await pc2.createAnswer(); await pc2.setLocalDescription(a)
  await new Promise((r) => setTimeout(r, 1500))
  await pc1.setRemoteDescription({ type: 'answer', sdp: strip(pc2.localDescription.sdp) })
  const r1 = await pc1.addIceCandidate({ candidate: `candidate:9 1 udp 1000 ${addr} ${qa} typ host`, sdpMLineIndex: 0 }).then(() => 'ok', (e) => String(e))
  const r2 = await pc2.addIceCandidate({ candidate: `candidate:9 1 udp 1000 ${addr} ${qb} typ host`, sdpMLineIndex: 0 }).then(() => 'ok', (e) => String(e))
  console.log('addIceCandidate: ' + r1 + ' / ' + r2)
  const t0 = Date.now()
  while (Date.now() - t0 < 25000 && !(pc1.connectionState === 'connected' && pc2.connectionState === 'connected')) await new Promise((r) => setTimeout(r, 250))
  await new Promise((r) => setTimeout(r, 1500))
  const pairs = async (pc) => { const st = await pc.getStats(); const c = {}; st.forEach((r) => { if (r.type === 'candidate-pair') c[r.state] = (c[r.state] || 0) + 1 }); return c }
  const st = await pc2.getStats(); let bytes = 0; st.forEach((r) => { if (r.type === 'inbound-rtp') bytes += r.bytesReceived })
  ipcRenderer.send('done', { c1: pc1.connectionState, c2: pc2.connectionState, ice1: pc1.iceConnectionState, pairs1: await pairs(pc1), pairs2: await pairs(pc2), bytes })
})()
</script>
