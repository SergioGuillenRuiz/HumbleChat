<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">Cómo se conecta una sala de HumbleChat</title><desc id="d">Tres pasos: los equipos preguntan a un directorio público quién más está en la sala; después cada equipo se conecta directamente con todos los demás formando una malla cifrada; y cada mensaje se reenvía por la malla y cada equipo guarda su copia, de modo que llega aunque dos equipos no puedan conectar entre sí.</desc>
